[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "miniengine"
version = "0.1.0"
description = "A minimal LLM serving engine for educational purposes"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.1.0",
    "transformers>=4.45.0",
    "safetensors>=0.4.0",
    "huggingface_hub>=0.20.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.0.0",
    "aiohttp>=3.9.0",
]

[project.optional-dependencies]
paged = [
    # PyPI 2.8.3.post2 forces C++17 and cannot build against PyTorch 2.14.
    # This pinned official commit selects C++20 for PyTorch >= 2.13.
    "flash-attn @ git+https://github.com/Dao-AILab/flash-attention.git@767386d814051d1d853c45ac952d8259b5bc7235",
    "ninja>=1.11",
    "packaging>=23.0",
    "psutil>=5.9",
]
bench = [
    "numpy",
    "pyarrow",
    "requests",
    "tqdm",
]

[project.scripts]
miniengine = "miniengine.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
