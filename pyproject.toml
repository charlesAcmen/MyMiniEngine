[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "miniengine"
version = "0.1.0"
description = "A minimal LLM serving engine for educational purposes"
requires-python = ">=3.10"
dependencies = [
    "torch==2.8.0",
    "transformers==5.23.0",
    "tokenizers==0.23.3",
    "safetensors==0.8.0",
    "huggingface_hub==2.4.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.0.0",
    "aiohttp>=3.9.0",
]

[project.optional-dependencies]
paged = [
    # Install the matching CUDA/PyTorch wheel from FlashAttention releases.
    "flash-attn==2.8.3.post2",
    "ninja>=1.11",
    "packaging>=23.0",
    "psutil>=5.9",
]
bench = [
    "numpy",
    "pyarrow",
    "requests",
    "tqdm",
]

[project.scripts]
miniengine = "miniengine.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
